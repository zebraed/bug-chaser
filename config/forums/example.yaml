forum:
  key: "example-forum"
  guild_id: 123456789012345678
  channel_id: 234567890123456789
  sync:
    interval_minutes: 10
    dry_run_default: true
  sheets:
    configured: false
    enabled: false
    auto_create: true
    spreadsheet_id:
    owner_email: "owner@example.com"
    editor_emails:
      - "owner@example.com"
    master_sheet_name: "Master"
    progress_sheet_name: "Progress"
  automation:
    enabled: false
    auto_comment: false
    auto_tag: false
    auto_archive: false
    auto_lock: false

states:
  duplicate:
    tags: ["Duplicate"]
  in_progress:
    tags: ["In Progress"]
  exported:
    tags: ["Wiki Exported"]
  closed:
    tags: ["Closed"]

actions:
  when_duplicate:
    add_comment: "This report has been recorded as a duplicate."
  when_in_progress:
    add_comment: "This report has been recorded as in progress."
  when_exported:
    add_tags: ["Closed"]
    archive: true
  when_closed:
    add_tags: ["Closed"]
    archive: true
    lock: true
