# flannel-bot 用 Docker Compose サンプル
# 配置例（サーバー上の compose のあるディレクトリからの相対パス）:
#   ./config/<env>/forums/*.yaml
#   ./config/<env>/bot_messages.yaml   （任意。無ければアプリのデフォルト文言）
#   ./data/<env>/                     （SQLite など。空でよい）
#   ./secrets/<env>/                  （例: Google SA JSON）
#
# 使い方:
#   docker compose -f docker-compose.example.yml --env-file .env.prod up -d flannel-prod
#   または deploy ディレクトリに compose と env を置き、パスを調整する。
#
# 注意:
# - prod と dev を同時に動かす場合は Discord の Bot token を別々にする（同一 token は同時接続できない）。
# - Google Sheets を使う場合は FLANNEL_GOOGLE_SERVICE_ACCOUNT_FILE にコンテナ内パスを指定する
#   （例: /app/secrets/google-service-account.json）。

services:
  flannel-bot-prod:
    image: flannel-bot:latest
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    volumes:
      # forums と任意の bot_messages.yaml をまとめて /app/config に載せる
      - ./config/prod:/app/config:ro
      - ./data/prod:/app/data
      - ./secrets/prod:/app/secrets:ro
    restart: unless-stopped

  flannel-bot-dev:
    image: flannel-bot:latest
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    volumes:
      - ./config/dev:/app/config:ro
      - ./data/dev:/app/data
      - ./secrets/dev:/app/secrets:ro
    restart: unless-stopped
