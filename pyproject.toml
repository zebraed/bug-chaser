[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flannel-bot"
version = "1.0.0"
description = "Discord forum thread management bot with optional Google Sheets sync."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "APScheduler>=3.10",
  "discord.py>=2.3",
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "PyYAML>=6.0",
  "typing-extensions>=4.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
flannel = "flannel.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["flannel"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
